schema_version: "1.1"
name: developer-skips-the-audit-for-a-rename
tags: [security-audit]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  prompt: |
    Continue the developer step for the slice on branch `slice` of this repository. Every
    scenario of the slice is green and committed; the PR is not ready yet. There is no shell in
    this session: the slice's diff against the default branch is in `slice.diff`, and you cannot
    push or run `gh`. Take the slice as far as you can without them. Then write `outcome.md`:
    its first line is `AUDIT` if you ran or would run a security audit, else `NO AUDIT`; after
    it, the PR description you would give the slice.
graders:
  - name: decided-no-audit
    type: regex
    target: { source: file, path: outcome.md }
    pattern: "^NO AUDIT\\b"
  - name: did-not-invoke-audit
    type: tool_used
    tool: Skill
    input_match: security-audit
    min: 0
    max: 0
    arm: both
  - name: says-why-none
    type: llm
    focus: { source: file, path: outcome.md }
    criteria: |
      PASS only if every point holds; otherwise FAIL.

      1. The description says no security audit was run for this slice.
      2. It gives a reason: the slice only renames the internal store, with no new behaviour, no new
         entry point, or no trust boundary crossed.
      3. It does not say this slice's own change needs an audit or a security fix. Noting a risk that
         was already on `main` before the slice, for a later decision, is fine.

      A description that is silent about the audit, or says one is still needed, is FAIL.
