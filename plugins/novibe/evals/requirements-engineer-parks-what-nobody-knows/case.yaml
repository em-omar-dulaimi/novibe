schema_version: "1.1"
name: requirements-engineer-parks-what-nobody-knows
tags: [open-question]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  prompt: |
    Run the requirements step for this idea from the driver: "A customer can cancel an order."
    There is no driver, no shell and no planning tool in this session: the driver's answers are
    below, use them where you would ask; for a question they do not cover, write the question and
    your recommendation into `outcome.md` and carry on as you recommend.

    The driver's answers:
    - The ticket is SHOP-310, under epic SHOP-300.
    - Customer 10042 has paid order 5001, one "Classic Kettle 1.7 l", not yet shipped. They cancel
      it and see order 5001 as cancelled, with the refund of 39.90 EUR on its way.
    - Can an order that has already shipped be cancelled? "Nobody here knows. The product owner
      decides that, and I don't think they have yet."

    Write the feature file you would write. `outcome.md` repeats that file whole, under its path,
    lists every question you would have asked with what you did with each, and names the item you
    would create in the planning tool, if any, with its parent and its assignee.
graders:
  - name: specifies-the-known-and-parks-the-unknown
    type: llm
    focus: { source: file, path: outcome.md }
    criteria: |
      PASS only if every point holds; otherwise FAIL.

      1. The feature file has a scenario for customer 10042 cancelling the paid, unshipped order
         5001, with those values and the driver's outcome (cancelled, refund on its way).
      2. Nothing in the file says what happens to an order that has already shipped: other than
         the line that names the open question, no scenario, outline row, Background line or
         description line says it can or cannot be cancelled, and nothing marks that behaviour
         as assumed, defaulted or decided.
      3. The shipped-order question is recorded as an item for the planning tool, a child of
         SHOP-310, for the product owner (named as such for the driver to plan, since no tool is
         connected), and one line under `Feature:` names the open question.
      4. The known rule is specified and proposed as the slice; the work does not stop on the
         open question.
