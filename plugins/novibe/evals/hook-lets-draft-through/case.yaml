schema_version: "1.1"
name: hook-lets-draft-through
tags: [hook, needs-bash]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 4
  allowed_tools: [Bash]
  prompt: |
    Run exactly this command once, and nothing else: `gh pr create --draft --title "Delete a user" --body "draft"`
    Then reply with what happened.
